# Fula AI Service
# Generated by install.sh
# Run certbot to add HTTPS support

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    # Must exceed the Ask AI route's own cap (bodyLimit 35MB / 30MB of files
    # in src/routes/ask.ts) — otherwise nginx 413s a legitimate multi-file ask
    # before the app can apply its own limit and refund logic.
    client_max_body_size 40M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation can take minutes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check endpoint (no logging)
    location /health {
        proxy_pass http://127.0.0.1:3002;
        access_log off;
    }
}
